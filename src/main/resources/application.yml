spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/products}
    username: ${DB_USERNAME:products}
    password: ${DB_PASSWORD:products}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  jackson.default-property-inclusion: non_null
server:
  error.include-message: never
  forward-headers-strategy: framework
app:
  enforce-https: ${ENFORCE_HTTPS:false}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-to-a-minimum-of-32-bytes}
    access-token-minutes: 15
    refresh-token-days: 7
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
springdoc.swagger-ui.path: /swagger-ui.html
